# ─── OPACITY ───────────────────────────────────────
inactive-opacity = 0.9;

opacity-rule = [
  "90:class_g = 'Xfce4-terminal'"
];   

# ─── ROUNDED CORNERS ───────────────────────────────
corner-radius = 8;

# ─── BLUR ──────────────────────────────────────────
# methods: none, gaussian, box, kernel, dual_kawase
blur:
{
	method = "dual_kawase";
	size = 10;
	strength = 3;
};

# semi-transparent
blur-background = true;
blur-background-fixed = true;

# SHADOWS
shadow = true;
shadow-radius = 1;
shadow-opacity= .1;

shadow-offset-x = 0;
shadow-offset-y = 0;

# ─── FADING ─────────────────────────────────────────
fading = true;

fade-in-step = 0.03;
fade-out-step = 0.03;
fade-delta = 3;

# backends: "xrender", "glx", "egl" or "xr_glx_hybrid"
backend = "egl";

dithered-present = false;
vsync = true;
